# SECURITY HEADERS: Must remain in sync with vercel.json.
# See AUDIT.md §23.2 N8 — both deployments ship identical security headers.
# When changing any header here, update vercel.json to match.
# Canonical reference: docs/SECURITY_HEADERS.md
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=web_guard:10m rate=80r/s;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), microphone=(self), geolocation=(self), payment=(self), publickey-credentials-get=(self), publickey-credentials-create=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Browser AI calls are intentionally blocked; AI traffic must use the Supabase ai-router Edge Function.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://*.supabase.co; worker-src 'self' blob:; upgrade-insecure-requests" always;

    location / {
      limit_req zone=web_guard burst=120 nodelay;
      try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
      try_files $uri =404;
    }
  }
}
