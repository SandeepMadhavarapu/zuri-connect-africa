services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        VITE_STRICT_ENV: ${VITE_STRICT_ENV:-false}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://placeholder.supabase.co}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder-placeholder-placeholder}
    image: zuri-connect-africa:${TAG:-local}
    ports:
      - "${HTTP_PORT:-8080}:80"
    restart: unless-stopped
